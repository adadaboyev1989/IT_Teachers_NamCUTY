<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>IT O'qituvchilar Namangan</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Applied synchronously, before first paint, so there's no flash of
      // the wrong theme. Inside Telegram, the Mini App follows the host
      // app's theme; everywhere else (the admin panel, or testing the Mini
      // App in a plain browser) it's the admin's stored choice, falling
      // back to the OS/browser preference. React's own theme code (see
      // src/lib/theme.ts and src/miniapp/lib/theme.ts) picks up from here
      // and keeps it in sync afterwards (toggle clicks, Telegram theme
      // changes, etc).
      (function () {
        try {
          var tg = window.Telegram && window.Telegram.WebApp;
          var theme;
          if (tg && tg.colorScheme) {
            theme = tg.colorScheme;
          } else {
            var stored = localStorage.getItem('theme');
            theme = stored === 'light' || stored === 'dark'
              ? stored
              : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          }
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
